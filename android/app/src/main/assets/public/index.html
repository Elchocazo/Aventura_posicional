<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>NumiMates</title>
    <style>
      body { margin: 0; background-color: #f0f9ff; font-family: system-ui, sans-serif; overflow: hidden; }
      #root { width: 100vw; height: 100vh; }
      #initial-loader {
        position: fixed; top: 0; left: 0; width: 100%; height: 100%;
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        background: #f0f9ff; z-index: 9999;
      }
      .spinner { width: 40px; height: 40px; border: 4px solid #bae6fd; border-top-color: #0284c7; border-radius: 50%; animation: spin 1s linear infinite; }
      @keyframes spin { to { transform: rotate(360deg); } }
      .error-box { padding: 20px; color: #b91c1c; background: #fef2f2; border: 2px solid #ef4444; margin: 10px; border-radius: 12px; font-family: monospace; font-size: 12px; }
    </style>
    <script type="module" src="./assets/index-C23mq56w.js"></script>
    <link rel="stylesheet" href="./assets/style-zFtkBryk.css">
  </head>
  <body>
    <div id="initial-loader">
      <div class="spinner"></div>
      <p style="color: #0369a1; font-weight: 900; margin-top: 15px;">CARGANDO AVENTURA...</p>
    </div>
    <div id="root"></div>

    <script type="text/javascript">
      window.onerror = function(msg, url, line) {
        var root = document.getElementById('root');
        var loader = document.getElementById('initial-loader');
        if (loader) loader.style.display = 'none';
        root.innerHTML = '<div class="error-box"><b>⚠️ Error de App:</b><br>' + msg + '<br><br><small>' + url + ' L:' + line + '</small></div>';
      };
    </script>
    <!-- El punto '.' inicial es fundamental para Android/Capacitor -->
  </body>
</html>
